[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dlmbench"
version = "0.1.0"
description = "Samples, metrics, and reproducible experiments for unconditional text generation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Antonio Franca"}, {name = "Alexander Tong"}]
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
paper = ["scipy>=1.11,<2", "matplotlib>=3.8,<4"]
tokenizers = ["transformers>=4.44,<5"]
neural = ["torch>=2.5,<3", "transformers>=4.44,<5", "mauve-text==0.4.0", "scipy>=1.11,<2", "scikit-learn>=1.3,<2"]
encoders = ["sentence-transformers>=3,<6"]
dev = ["pytest>=9.0.3,<10", "build>=1.2", "ruff>=0.9"]

[project.scripts]
dlmbench = "dlmbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dlmbench"]

[tool.hatch.build.targets.sdist]
exclude = ["/samples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
